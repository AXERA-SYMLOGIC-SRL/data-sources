[alembic]
script_location = src/data_sources/store/migrations
prepend_sys_path = src

# Only used by the standalone `alembic` CLI (e.g. `alembic revision --autogenerate`).
# `Store.migrate()` ignores this file and runs against whatever engine it already holds.
sqlalchemy.url = sqlite+aiosqlite:///./data_sources.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
