[project]
name = "axera-data-sources"
version = "0.1.0"
description = "Unified, configurable connectors for enterprise data sources."
authors = [
    {name = "AXERA SYMLOGIC SRL"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["data-sources", "connectors", "etl", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "azure-identity (>=1.19.0,<2.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "greenlet (>=3.0.0,<4.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)"
]

[project.urls]
Homepage = "https://github.com/AXERA-SYMLOGIC-SRL/data-sources"
Repository = "https://github.com/AXERA-SYMLOGIC-SRL/data-sources"
Issues = "https://github.com/AXERA-SYMLOGIC-SRL/data-sources/issues"

[project.optional-dependencies]
api = ["fastapi (>=0.141.1,<0.142.0)"]
postgresql = ["asyncpg (>=0.30.0,<0.31.0)"]

[tool.poetry]
packages = [{ include = "data_sources", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "types-pyyaml (>=6.0.12.20260724,<7.0.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.30.0,<0.31.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
